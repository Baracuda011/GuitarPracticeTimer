name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      # Proves the timer actually publishes for this platform, and surfaces
      # trimming warnings — which only appear at publish time, never at build.
      - name: Publish
        run: >
          dotnet publish src/GuitarPracticeTimer.Desktop/GuitarPracticeTimer.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --output publish/${{ matrix.rid }}

      - name: Report payload size
        shell: bash
        run: du -sh publish/${{ matrix.rid }} && ls -la publish/${{ matrix.rid }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuitarPracticeTimer-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/
          retention-days: 14
          if-no-files-found: error

  generators:
    name: Generated assets are reproducible
    # Pinned to Windows because that is where the committed assets were
    # generated. zlib output can differ between platforms, which would fail
    # this check for a reason that has nothing to do with the generators.
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate the icon and the chime
        run: |
          python make_icon.py
          python make_chime.py

      - name: Fail if either committed asset is out of date
        shell: pwsh
        run: |
          git diff --exit-code -- Assets/app.ico Assets/chime.wav
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Assets/ differs from its generator output. Run 'python make_icon.py' and 'python make_chime.py', then commit the result."
            exit 1
          }
