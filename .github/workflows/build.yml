name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          # Apple silicon. Nobody on this project owns a Mac, so this runner is
          # the only place the macOS build is ever compiled or started.
          - os: macos-latest
            rid: osx-arm64

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Named projects rather than the solution on purpose: the solution now
      # contains a net10.0-android head, and building it needs the Android
      # workload, which these runners do not have. The android job below
      # installs it once instead of paying for it on both desktop runners.
      - name: Build desktop
        run: >
          dotnet build src/GuitarPracticeTimer.Desktop/GuitarPracticeTimer.Desktop.csproj
          --configuration Release -warnaserror

      - name: Test
        run: >
          dotnet test tests/GuitarPracticeTimer.Core.Tests/GuitarPracticeTimer.Core.Tests.csproj
          --configuration Release -warnaserror --verbosity normal

      # Proves the timer actually publishes for this platform, and surfaces
      # trimming warnings - which only appear at publish time, never at build.
      - name: Publish
        run: >
          dotnet publish src/GuitarPracticeTimer.Desktop/GuitarPracticeTimer.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --output publish/${{ matrix.rid }}

      - name: Report payload size
        shell: bash
        run: du -sh publish/${{ matrix.rid }} && ls -la publish/${{ matrix.rid }}

      # The release ships one universal download, so build the same thing here
      # rather than a single architecture. A change that breaks bundling or the
      # fat-binary merge is then caught on the push that causes it.
      - name: Publish the second architecture
        if: matrix.os == 'macos-latest'
        shell: bash
        run: >
          dotnet publish src/GuitarPracticeTimer.Desktop/GuitarPracticeTimer.Desktop.csproj
          --configuration Release --runtime osx-x64 --output publish/osx-x64

      - name: Build the universal .app bundle
        if: matrix.os == 'macos-latest'
        shell: bash
        run: >
          python make_macos_app.py publish/osx-arm64 publish/osx-x64
          --arch universal --out bundle

      # make_macos_app.py assembles the universal binary itself, so that the
      # packaging runs anywhere. On a Mac, Apple's own tool gets to check it.
      - name: Verify the universal binary with lipo
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          for f in bundle/GuitarPracticeTimer.app/Contents/MacOS/GuitarPracticeTimer \
                   bundle/GuitarPracticeTimer.app/Contents/MacOS/libminiaudio.dylib; do
            echo "--- $f"
            lipo -info "$f"
            lipo -verify_arch x86_64 arm64 "$f"
          done

      # Actually start it. Compiling for macOS proves very little on its own -
      # the interesting failures are at runtime, when the .NET host, Skia and
      # miniaudio dylibs load. The app is given a few seconds and then checked
      # for a pulse; if it had crashed on startup the process would be gone.
      #
      # There is no display on the runner, so the window is never drawn. This
      # says "it starts and stays up", not "it looks right" and not "the chime
      # can be heard" - both of those still need a person in front of a Mac.
      - name: Smoke test the macOS bundle
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          APP="bundle/GuitarPracticeTimer.app/Contents/MacOS/GuitarPracticeTimer"
          test -x "$APP" || { echo "executable bit missing on $APP"; exit 1; }
          "$APP" > app.log 2>&1 &
          APP_PID=$!
          sleep 12

          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "Still running after 12s - startup succeeded."
            kill "$APP_PID" 2>/dev/null || true
            echo "--- output ---"; cat app.log || true
          else
            wait "$APP_PID"; STATUS=$?
            echo "Exited early with status $STATUS"
            echo "--- output ---"; cat app.log || true
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuitarPracticeTimer-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/
          retention-days: 14
          if-no-files-found: error

      # The packaged bundle, separately, so a Mac can be tried from any push
      # without cutting a release first. Download it from the run's Artifacts
      # section; GitHub wraps it in a .zip, so it unpacks to the .tar.gz.
      - name: Upload the macOS app
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: GuitarPracticeTimer-macos-app
          path: bundle/*.tar.gz
          retention-days: 14
          if-no-files-found: error

  android:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install the Android workload
        run: dotnet workload install android

      - name: Build
        run: >
          dotnet build src/GuitarPracticeTimer.Android/GuitarPracticeTimer.Android.csproj
          --configuration Release -warnaserror

  stylesheet:
    name: docs/app.main.css matches styles/
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Sass
        run: npm ci

      # docs/ is uploaded to Azure verbatim, so the compiled stylesheet has to
      # be committed rather than built at deploy time. That makes it possible
      # to edit the CSS directly and have the SCSS silently stop being the
      # source of truth. Recompiling and diffing is what stops that.
      - name: Recompile and compare
        run: |
          npm run css
          if ! git diff --exit-code --stat docs/app.main.css; then
            echo
            echo "docs/app.main.css is not what styles/ compiles to."
            echo "Run 'npm run css' and commit the result."
            exit 1
          fi
          echo "In sync."

  generators:
    name: Generated assets match their generators
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Compares the icon by decoded pixels rather than by bytes. PNG data is
      # zlib-compressed and zlib's output differs between versions, so the same
      # icon is 8142 bytes on one Python and 8005 on another - a byte
      # comparison fails for a reason unrelated to whether the icon is correct.
      - name: Verify Assets/ against make_icon.py and make_chime.py
        run: python verify_assets.py
