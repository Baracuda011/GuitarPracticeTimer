name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Named projects rather than the solution on purpose: the solution now
      # contains a net10.0-android head, and building it needs the Android
      # workload, which these runners do not have. The android job below
      # installs it once instead of paying for it on both desktop runners.
      - name: Build desktop
        run: >
          dotnet build src/GuitarPracticeTimer.Desktop/GuitarPracticeTimer.Desktop.csproj
          --configuration Release -warnaserror

      - name: Test
        run: >
          dotnet test tests/GuitarPracticeTimer.Core.Tests/GuitarPracticeTimer.Core.Tests.csproj
          --configuration Release -warnaserror --verbosity normal

      # Proves the timer actually publishes for this platform, and surfaces
      # trimming warnings - which only appear at publish time, never at build.
      - name: Publish
        run: >
          dotnet publish src/GuitarPracticeTimer.Desktop/GuitarPracticeTimer.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --output publish/${{ matrix.rid }}

      - name: Report payload size
        shell: bash
        run: du -sh publish/${{ matrix.rid }} && ls -la publish/${{ matrix.rid }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuitarPracticeTimer-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/
          retention-days: 14
          if-no-files-found: error

  android:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install the Android workload
        run: dotnet workload install android

      - name: Build
        run: >
          dotnet build src/GuitarPracticeTimer.Android/GuitarPracticeTimer.Android.csproj
          --configuration Release -warnaserror

  generators:
    name: Generated assets match their generators
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Compares the icon by decoded pixels rather than by bytes. PNG data is
      # zlib-compressed and zlib's output differs between versions, so the same
      # icon is 8142 bytes on one Python and 8005 on another - a byte
      # comparison fails for a reason unrelated to whether the icon is correct.
      - name: Verify Assets/ against make_icon.py and make_chime.py
        run: python verify_assets.py
