name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v2.0.0)"
        required: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: >
          dotnet publish src/GuitarPracticeTimer.Desktop/GuitarPracticeTimer.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --output publish/${{ matrix.rid }}

      - name: Package (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish/win-x64/* -DestinationPath "dist/GuitarPracticeTimer-win-x64.zip"

      - name: Package (Linux)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          mkdir -p dist
          chmod +x publish/linux-x64/GuitarPracticeTimer
          tar -czf "dist/GuitarPracticeTimer-linux-x64.tar.gz" -C publish/linux-x64 .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}
          path: dist/
          if-no-files-found: error

  macos:
    name: Build ${{ matrix.rid }}
    # A real Mac. Building the bundle needs no Apple tooling, but publishing a
    # macOS binary and knowing it starts does.
    runs-on: macos-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - rid: osx-arm64
            arch: apple-silicon
          - rid: osx-x64
            arch: intel

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Publish
        run: >
          dotnet publish src/GuitarPracticeTimer.Desktop/GuitarPracticeTimer.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --output publish/${{ matrix.rid }}

      - name: Build the .app bundle
        run: >
          python make_macos_app.py publish/${{ matrix.rid }}
          --arch ${{ matrix.arch }}
          --out dist

      # Start the binary inside the bundle. Compiling proves very little on its
      # own - the interesting failures happen when the .NET host, Skia and
      # miniaudio dylibs load. There is no display on the runner, so this says
      # "it starts and stays up", not "it looks right" and not "it makes a
      # sound". Those still need a person in front of a Mac.
      - name: Smoke test the bundle
        run: |
          APP="dist/GuitarPracticeTimer.app/Contents/MacOS/GuitarPracticeTimer"
          test -x "$APP" || { echo "executable bit missing on $APP"; exit 1; }
          "$APP" > app.log 2>&1 &
          APP_PID=$!
          sleep 12

          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "Still running after 12s - startup succeeded."
            kill "$APP_PID" 2>/dev/null || true
            echo "--- output ---"; cat app.log || true
          else
            wait "$APP_PID"; STATUS=$?
            echo "Exited early with status $STATUS"
            echo "--- output ---"; cat app.log || true
            exit 1
          fi

      # The .app itself is only needed for the smoke test; the tarball is what
      # ships, and leaving the bundle in place would upload every file twice.
      - name: Keep only the archive
        run: rm -rf dist/GuitarPracticeTimer.app && ls -la dist

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}
          path: dist/
          if-no-files-found: error

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    # Job level, not step level: a step's own env is not in scope for its `if`,
    # so the signing step would have been skipped even with the secret set.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install the Android workload
        run: dotnet workload install android

      # arm64 only. A default build also bundles a 32-bit slice and doubles the
      # download to 40 MB, and unlike the Play bundle a plain .apk has no store
      # to split it per device.
      #
      # Signing: if the repository has an upload keystore in its secrets it is
      # used, otherwise the build falls back to the debug key. A debug-signed
      # .apk installs perfectly well by sideloading - it is only Google Play
      # that refuses one - so the direct download works either way.
      # MSBuild reads environment variables as properties, so exporting these is
      # the same as passing -p:, without the secrets ever appearing in a command
      # line. When no keystore secret is configured nothing is exported, the
      # csproj leaves AndroidKeyStore off, and the build falls back to the debug
      # key.
      - name: Configure signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "AndroidSigningKeyStore=$RUNNER_TEMP/upload.jks"
            echo "AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "AndroidSigningStorePass=${{ secrets.ANDROID_STORE_PASSWORD }}"
            echo "AndroidSigningKeyPass=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Publish APK
        run: >
          dotnet publish src/GuitarPracticeTimer.Android/GuitarPracticeTimer.Android.csproj
          --configuration Release
          -p:Abi=arm64
          -p:AndroidPackageFormat=apk
          --output publish/android

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp publish/android/*-Signed.apk "dist/GuitarPracticeTimer-android-arm64.apk"
          ls -la dist

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-android
          path: dist/
          if-no-files-found: error

  release:
    name: Attest, checksum and publish
    needs: [build, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Collect packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      # A cryptographic record that these exact files were produced by this
      # workflow, from this commit, on GitHub's runners. Anyone can check it:
      #   gh attestation verify <file> --repo Baracuda011/GuitarPracticeTimer
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          draft: true
          body: |
            ## Guitar Practice Timer

            | Platform | Download |
            | --- | --- |
            | Windows 10/11 (x64) | `GuitarPracticeTimer-win-x64.zip` - extract and run `GuitarPracticeTimer.exe` |
            | Linux (x64) | `GuitarPracticeTimer-linux-x64.tar.gz` - extract and run `./GuitarPracticeTimer` |
            | macOS (Apple silicon) | `GuitarPracticeTimer-macos-apple-silicon.tar.gz` - unpack and open the app |
            | macOS (Intel) | `GuitarPracticeTimer-macos-intel.tar.gz` - unpack and open the app |
            | Android (arm64) | `GuitarPracticeTimer-android-arm64.apk` - open it on the phone to install |

            The Android build is here for direct install while the Play Store
            listing is in review. Android will warn that it came from outside the
            Play Store; that is expected for any sideloaded app and is not a
            report of anything found. An iOS build is planned.

            **On macOS**, the app is not yet signed with an Apple Developer
            certificate, so the first launch reports that macOS "could not
            verify" it. Right-click the app and choose *Open* to get past that
            once; it opens normally afterwards. Check the chip in  -> About
            This Mac if you are unsure which of the two files you need.

            Nothing to install and no .NET runtime to fetch first - everything is
            bundled into the one binary.

            ### Verifying this download

            **Provenance.** These files were built by GitHub Actions from this
            repository's source, and carry a signed attestation proving it:

            ```
            gh attestation verify GuitarPracticeTimer-win-x64.zip \
              --repo Baracuda011/GuitarPracticeTimer
            ```

            **Checksums.** `SHA256SUMS.txt` lists a fingerprint for every file:

            ```
            sha256sum -c SHA256SUMS.txt           # Linux
            Get-FileHash *.zip -Algorithm SHA256 # Windows
            ```

            ### On first run

            Windows may ask you to confirm before opening a program it has not
            seen many people run yet - choose *More info* → *Run anyway*. That
            prompt reflects how widely a program has been downloaded so far,
            not anything found inside it.

            The app has no networking code of any kind, so it cannot send
            anything anywhere.
