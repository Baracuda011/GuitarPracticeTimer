name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v2.0.0)"
        required: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: >
          dotnet publish src/GuitarPracticeTimer.Desktop/GuitarPracticeTimer.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --output publish/${{ matrix.rid }}

      - name: Package (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish/win-x64/* -DestinationPath "dist/GuitarPracticeTimer-win-x64.zip"

      - name: Package (Linux)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          mkdir -p dist
          chmod +x publish/linux-x64/GuitarPracticeTimer
          tar -czf "dist/GuitarPracticeTimer-linux-x64.tar.gz" -C publish/linux-x64 .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}
          path: dist/
          if-no-files-found: error

  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install the Android workload
        run: dotnet workload install android

      # arm64 only. A default build also bundles a 32-bit slice and doubles the
      # download to 40 MB, and unlike the Play bundle a plain .apk has no store
      # to split it per device.
      #
      # Signing: if the repository has an upload keystore in its secrets it is
      # used, otherwise the build falls back to the debug key. A debug-signed
      # .apk installs perfectly well by sideloading - it is only Google Play
      # that refuses one - so the direct download works either way.
      # MSBuild reads environment variables as properties, so exporting these is
      # the same as passing -p:, without the secrets ever appearing in a command
      # line. When no keystore secret is configured nothing is exported, the
      # csproj leaves AndroidKeyStore off, and the build falls back to the debug
      # key.
      - name: Configure signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "AndroidSigningKeyStore=$RUNNER_TEMP/upload.jks"
            echo "AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "AndroidSigningStorePass=${{ secrets.ANDROID_STORE_PASSWORD }}"
            echo "AndroidSigningKeyPass=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Publish APK
        run: >
          dotnet publish src/GuitarPracticeTimer.Android/GuitarPracticeTimer.Android.csproj
          --configuration Release
          -p:Abi=arm64
          -p:AndroidPackageFormat=apk
          --output publish/android

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp publish/android/*-Signed.apk "dist/GuitarPracticeTimer-android-arm64.apk"
          ls -la dist

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-android
          path: dist/
          if-no-files-found: error

  release:
    name: Attest, checksum and publish
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Collect packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      # A cryptographic record that these exact files were produced by this
      # workflow, from this commit, on GitHub's runners. Anyone can check it:
      #   gh attestation verify <file> --repo Baracuda011/GuitarPracticeTimer
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          draft: true
          body: |
            ## Guitar Practice Timer

            | Platform | Download |
            | --- | --- |
            | Windows 10/11 (x64) | `GuitarPracticeTimer-win-x64.zip` - extract and run `GuitarPracticeTimer.exe` |
            | Linux (x64) | `GuitarPracticeTimer-linux-x64.tar.gz` - extract and run `./GuitarPracticeTimer` |
            | Android (arm64) | `GuitarPracticeTimer-android-arm64.apk` - open it on the phone to install |

            The Android build is here for direct install while the Play Store
            listing is in review. Android will warn that it came from outside the
            Play Store; that is expected for any sideloaded app and is not a
            report of anything found. macOS and iOS builds are planned.

            Nothing to install and no .NET runtime to fetch first - everything is
            bundled into the one binary.

            ### Verifying this download

            **Provenance.** These files were built by GitHub Actions from this
            repository's source, and carry a signed attestation proving it:

            ```
            gh attestation verify GuitarPracticeTimer-win-x64.zip \
              --repo Baracuda011/GuitarPracticeTimer
            ```

            **Checksums.** `SHA256SUMS.txt` lists a fingerprint for every file:

            ```
            sha256sum -c SHA256SUMS.txt           # Linux
            Get-FileHash *.zip -Algorithm SHA256 # Windows
            ```

            ### On first run

            Windows may ask you to confirm before opening a program it has not
            seen many people run yet - choose *More info* → *Run anyway*. That
            prompt reflects how widely a program has been downloaded so far,
            not anything found inside it.

            The app has no networking code of any kind, so it cannot send
            anything anywhere.
