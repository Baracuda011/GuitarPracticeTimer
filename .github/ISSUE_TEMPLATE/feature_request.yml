name: Feature request
description: Suggest something that would make the app a better practice tool
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before you write this up, it's worth knowing what the project is
        optimising for - see
        [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md#what-this-project-is-trying-to-be).

        The short version: one window, no settings dialog, no third-party
        packages, and the enforced break stays enforced.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: >
        Describe the practice situation where the app currently gets in your way.
        Start with the problem, not the solution - it often turns out there's a
        simpler fix than the one you had in mind.
      placeholder: >
        I practise three different licks in rotation and I lose track of which
        one I'm on after a break.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
      description: Your proposed behaviour, in as much detail as you have.
    validations:
      required: true

  - type: dropdown
    id: scope-check
    attributes:
      label: Does this need a settings screen to work?
      description: >
        The app deliberately has no preferences UI. Features that need one are a
        hard sell, though not automatically refused.
      options:
        - "No - it works with the existing controls or a sensible fixed default"
        - "Yes - it would need somewhere to configure it"
        - "Not sure"
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This does not require adding a NuGet package or Python dependency
          required: false
        - label: This does not weaken or bypass the enforced cooldown
          required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Other ways to solve the same problem, including doing nothing.
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: >
        If your suggestion is based on how practice or motor learning works,
        a citation helps - the README's claims are sourced and new ones should be
        too.
    validations:
      required: false
